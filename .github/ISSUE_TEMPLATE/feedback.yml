name: eliVibe feedback
description: Tell us what an explanation helped you understand, what missed, or where installation got stuck.
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Use synthetic examples and omit credentials, private reports, and raw transcripts. For suspected vulnerabilities or data exposure, [report privately](https://github.com/taibenvenuti/elivibe/security/advisories/new) instead.
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: If known, include the eliVibe version and install source, host and version (Oh My Pi, Codex CLI, or Claude Code CLI), and operating system. Say whether you used the OMP adapter, a packaged skill or a standalone skill. No local paths or account details.
      placeholder: eliVibe v1.0.0 from npm, Oh My Pi 19.2.1 adapter, Linux x64
    validations:
      required: false
  - type: textarea
    id: feedback
    attributes:
      label: What helped or got in the way?
      description: Was an explanation helpful, confusing, repetitive or misleading? Name the concept and what you can now explain, or what is still unclear. For an install or command issue, include the step or exact invocation and what happened.
    validations:
      required: true
  - type: textarea
    id: synthetic-example
    attributes:
      label: Small synthetic example (optional)
      description: A minimal reproduction or a made-up handoff is enough. Say what a useful supplement would clarify without changing the report.
