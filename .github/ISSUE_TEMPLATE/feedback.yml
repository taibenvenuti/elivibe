name: eliVibe feedback
description: Tell us what an explanation helped you understand, what missed, or where installation got stuck.
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Use synthetic examples and omit credentials, private reports, and raw transcripts. For suspected vulnerabilities or data exposure, [report privately](https://github.com/taibenvenuti/elivibe/security/advisories/new) instead.
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: If known, include your eliVibe version, installation source, host and operating system. No local paths or account details.
      placeholder: v1.0.0 GitHub tag, OMP 19.2.1, Linux x64
    validations:
      required: false
  - type: textarea
    id: feedback
    attributes:
      label: What helped or got in the way?
      description: Was an explanation helpful, confusing, repetitive or misleading? Name the concept and what you can now explain, or what is still unclear. For an install or command issue, say which step and what happened.
    validations:
      required: true
  - type: textarea
    id: synthetic-example
    attributes:
      label: Small synthetic example (optional)
      description: A minimal reproduction or a made-up handoff is enough. Say what a useful supplement would clarify without changing the report.
