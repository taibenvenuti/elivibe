name: Release rehearsal (no publication)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reproduce a published tag or rehearse the reviewed checkout
        type: choice
        options:
          - published
          - candidate
        default: published
      published_tag:
        description: Published mode only; reproduce the tagged artifacts with their original license (defaults to highest reachable stable annotated tag)
        type: string
      candidate_sha:
        description: Candidate mode only; full reviewed SHA of the selected branch with its untagged GPL-3.0-only version
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    name: Release policy fixtures and exact-revision packages
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node dev/release-rules.mjs
      - name: Rebuild and inspect packages (no upload)
        env:
          MODE: ${{ inputs.mode }}
          PUBLISHED_TAG: ${{ inputs.published_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          output=$(mktemp -d)
          case "$MODE" in
            published)
              test -z "$CANDIDATE_SHA"
              sh dev/rehearse-release.sh published "$PUBLISHED_TAG" "$output"
              ;;
            candidate)
              test -z "$PUBLISHED_TAG"
              test "$CANDIDATE_SHA" = "$GITHUB_SHA"
              sh dev/rehearse-release.sh candidate "$CANDIDATE_SHA" "$output"
              ;;
            *) exit 2 ;;
          esac
